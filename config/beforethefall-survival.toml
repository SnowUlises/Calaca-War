
[apocalypse]
	#Самый ранний день удара (день 1 — первый день мира).
	#Для каждого мира день удара выбирается случайно между этим значением и следующим, один раз при создании мира.
	#Менее 3 нельзя: предупреждения по радио не успеют прозвучать.
	#Range: 3 ~ 365
	strikeDayMin = 15
	#Самый поздний день удара. Если меньше strikeDayMin — берётся strikeDayMin.
	#Одинаковые значения дают точную дату. Игроку дата не показывается.
	#Уже созданный мир, где удар ещё не случился, сохраняет свою дату; изменить её можно командой /btf blast day <день>.
	#Range: 3 ~ 365
	strikeDayMax = 18
	#Сколько секунд звучит воздушная тревога до удара: не меньше. Одинаковые значения — без случайности (по умолчанию ровно 90).
	#Range: 5 ~ 600
	sirenSecondsMin = 90
	#Сколько секунд звучит воздушная тревога до удара: не больше.
	#Range: 5 ~ 600
	sirenSecondsMax = 90

[radiation]
	#Множитель радиационного фона после удара и силы выбросов. 1.0 — как задумано, 0.5 — вдвое слабее.
	#Range: 0.0 ~ 10.0
	backgroundMultiplier = 1.0
	#Множитель набора дозы игроком. Не меняет показания счётчика Гейгера, только скорость, с которой доза копится.
	#Range: 0.0 ~ 10.0
	doseMultiplier = 1.0
	#Множитель износа фильтра противогаза. 0.5 — служит вдвое дольше, 0 — не изнашивается.
	#Range: 0.0 ~ 10.0
	filterWearMultiplier = 1.0

[world]
	#Естественные рейды мародёров на убежища. Рейды из-за отказа от дани и отряды на дорогах не затрагиваются.
	raids = true
	#Метеоритные дожди после удара.
	meteorShowers = true

[flash]
	#Запись своего звука на чистую флешку по ссылке (сервер сам скачивает файл и раздаёт его игрокам).
	enabled = true
	#true — записывать могут только операторы сервера; false — любой игрок.
	operatorsOnly = true
	#Самая длинная запись, секунд.
	#Range: 1 ~ 900
	maxSeconds = 180
	#Самый большой файл, мегабайт.
	#Range: 1 ~ 100
	maxMegabytes = 15
	#Общая квота записей в папке мира, мегабайт. Новые уникальные записи отклоняются при заполнении.
	#Range: 16 ~ 100000
	storageMegabytes = 500
	#Сколько успешных записей один игрок может сделать за календарные сутки сервера.
	#Range: 1 ~ 1000
	recordsPerPlayerPerDay = 10
	#Разрешённые сайты, например ["cdn.example.com"]: подходит и сам сайт, и его поддомены.
	#Пусто — любой сайт с публичным адресом. Адреса локальной сети и самого компьютера запрещены всегда.
	allowedHosts = []

[text]
	#Тексты радиопередач и записок. false — как задумано, с крепкими выражениями; true — цензурный вариант (те же книги и страницы, без мата).
	#Можно переключать и в игре: Mods → BeforeTheFall → Config.
	censoredText = false

